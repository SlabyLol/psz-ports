name: PSZ CI/CD & Auto-Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and Run Unit Tests
        run: |
          cd tests
          make

  build-psp:
    needs: run-unit-tests
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build PSP
        run: |
          cd platforms/psp
          make eboot
      - name: Upload PSP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psz-psp
          path: platforms/psp/EBOOT.PBP

  build-3ds:
    needs: run-unit-tests
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build 3DS
        run: |
          dfile-configure || true
          cd platforms/3ds
          make
      - name: Upload 3DS 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: psz-3ds-3dsx
          path: platforms/3ds/psz_3ds.3dsx
      - name: Upload 3DS CIA
        uses: actions/upload-artifact@v4
        with:
          name: psz-3ds-cia
          path: platforms/3ds/psz_3ds.cia

  build-wii-wiiu:
    needs: run-unit-tests
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Wii
        run: |
          cd platforms/wii
          make
      - name: Build Wii U
        run: |
          cd platforms/wiiu
          make
      - name: Upload Wii DOL
        uses: actions/upload-artifact@v4
        with:
          name: psz-wii-dol
          path: platforms/wii/psz_wii.dol
      - name: Upload Wii U WUHB
        uses: actions/upload-artifact@v4
        with:
          name: psz-wiiu-wuhb
          path: platforms/wiiu/psz_wiiu.wuhb

  create-release:
    needs: [build-psp, build-3ds, build-wii-wiiu]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/EBOOT.PBP
            release-assets/psz_3ds.3dsx
            release-assets/psz_3ds.cia
            release-assets/psz_wii.dol
            release-assets/psz_wiiu.wuhb
          name: PSZ Homebrew Release ${{ github.ref_name }}
          body: |
            Automated multi-platform release for PSZ Archive Studio.
            
            Supported Formats & Consoles:
            - Sony PSP: `EBOOT.PBP` (Memory Stick)
            - Nintendo 3DS: `psz_3ds.3dsx` (Homebrew Launcher) & `psz_3ds.cia` (Installable CIA)
            - Nintendo Wii: `psz_wii.dol` (Homebrew Channel)
            - Nintendo Wii U: `psz_wiiu.wuhb` (Wii U Menu / Aroma / Tiramisu)
            
            Verified by automated unit tests.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
