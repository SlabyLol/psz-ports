name: PSZ CI/CD & Auto-Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-unit-tests:
    name: C-Core unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and run tests
        run: make -C tests clean all

  build-psp:
    name: Build PSP EBOOT.PBP
    needs: run-unit-tests
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build PSP package
        run: make -C platforms/psp clean all
      - name: Upload PSP package
        uses: actions/upload-artifact@v4
        with:
          name: psz-psp
          path: platforms/psp/EBOOT.PBP
          if-no-files-found: error

  build-3ds:
    name: Build Nintendo 3DS 3DSX
    needs: run-unit-tests
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build 3DSX package
        run: make -C platforms/3ds clean all
      - name: Upload 3DSX package
        uses: actions/upload-artifact@v4
        with:
          name: psz-3ds
          path: platforms/3ds/psz_3ds.3dsx
          if-no-files-found: error

  build-wii:
    name: Build Nintendo Wii DOL
    needs: run-unit-tests
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Wii package
        run: make -C platforms/wii clean all
      - name: Upload Wii package
        uses: actions/upload-artifact@v4
        with:
          name: psz-wii
          path: platforms/wii/psz_wii.dol
          if-no-files-found: error

  build-wiiu:
    name: Build Nintendo Wii U WUHB
    needs: run-unit-tests
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Wii U package
        run: make -C platforms/wiiu clean all
      - name: Upload Wii U package
        uses: actions/upload-artifact@v4
        with:
          name: psz-wiiu
          path: platforms/wiiu/psz_wiiu.wuhb
          if-no-files-found: error

  create-release:
    name: Publish Continuous Release
    needs: [build-psp, build-3ds, build-wii, build-wiiu]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish or update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PSZ Homebrew (Continuous Build)
          body: |
            Automated continuous build containing the latest updates for PSP, 3DS, Wii, and Wii U.
            Commit: ${{ github.sha }}
          prerelease: true
          files: |
            release-assets/EBOOT.PBP
            release-assets/psz_3ds.3dsx
            release-assets/psz_wii.dol
            release-assets/psz_wiiu.wuhb
